<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sudoku</title>
  <meta name="description" content="Ein einfaches Sudoku, offline spielbar.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1d22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1>Sudoku</h1>
      <div class="info">
        <span id="level-label">Mittel</span>
        <span class="dot">·</span>
        <span id="timer">0:00</span>
        <span class="dot">·</span>
        <span id="mistakes">0 Fehler</span>
      </div>
      <button id="new-btn" class="btn">Neues Spiel</button>
    </header>

    <div class="play">
      <div id="board" class="board" role="grid" aria-label="Sudoku-Feld"></div>

      <div class="controls">
        <div class="tools">
          <button id="undo-btn" class="tool" aria-label="Rückgängig">
            <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
            <span>Zurück</span>
          </button>
          <button id="erase-btn" class="tool" aria-label="Löschen">
            <svg viewBox="0 0 24 24"><path d="M20 20H8l-4-4 10-10 6 6-6 6"/><path d="m9 11 6 6"/></svg>
            <span>Löschen</span>
          </button>
          <button id="notes-btn" class="tool" aria-pressed="false" aria-label="Notizen">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span>Notizen <b id="notes-state">aus</b></span>
          </button>
          <button id="hint-btn" class="tool" aria-label="Tipp">
            <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2Z"/></svg>
            <span>Tipp</span>
          </button>
        </div>
        <div id="pad" class="pad"></div>
      </div>
    </div>
  </main>

  <dialog id="new-dialog" class="sheet">
    <form method="dialog">
      <h2>Neues Spiel</h2>
      <p>Schwierigkeit wählen:</p>
      <div class="levels">
        <button value="easy" class="btn big">Leicht</button>
        <button value="medium" class="btn big">Mittel</button>
        <button value="hard" class="btn big">Schwer</button>
      </div>
      <button value="cancel" class="btn ghost">Abbrechen</button>
    </form>
  </dialog>

  <dialog id="win-dialog" class="sheet">
    <form method="dialog">
      <h2>Geschafft! 🎉</h2>
      <p id="win-text"></p>
      <div class="levels">
        <button value="again" class="btn big">Noch eins</button>
      </div>
      <button value="close" class="btn ghost">Schließen</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
